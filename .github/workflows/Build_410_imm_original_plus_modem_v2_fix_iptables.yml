name: Build_imm_高通410系列

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: ' ← 选择是否开启 SSH 调试专业人员使用'
        required: false
        default: false
        type: boolean

      profile:
        description: ' ↓ 支持多款型号 手动选择要编译的机型 ↓ '
        type: choice
        options:
          - ufi003
          - ufi001c
          - ufi001b
          - ufi103s
          - jz02v10
          - qrzl903
          - w001
          - uz801
          - mf32
          - mf601
          - wf2
          - sp970v11
          - sp970v10
        default: ufi003
        required: true

      upstream:
        description: ' ↓ 选择上游源码仓库 ↓ '
        type: choice
        options:
          - lkiuyu/immortalwrt
          - xuxin1955/immortalwrt
        default: lkiuyu/immortalwrt
        required: true

      modem:
        description: ' ↓ Modem / 基带版本选择 ↓ '
        type: choice
        options:
          - 保留modem
          - 仅去除用户态modem
          - 去除内核基带modem
        default: 保留modem
        required: true

      extra_packages:
        description: ' ↓ 输入额外包名（逗号或空格分隔，留空则不添加任何额外包）↓ '
        required: false
        default: ''
        type: string

env:
  REPO_URL: https://github.com/${{ github.event.inputs.upstream }}
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: ${{ format('config/{0}.config', github.event.inputs.profile) }}
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Normalize modem option
        run: |
          MODEM_INPUT='${{ github.event.inputs.modem }}'

          if [ "$MODEM_INPUT" = "保留modem" ]; then
            echo "MODEM_ID=with_modem" >> "$GITHUB_ENV"
            echo "MODEM_LABEL=保留modem" >> "$GITHUB_ENV"
          elif [ "$MODEM_INPUT" = "仅去除用户态modem" ]; then
            echo "MODEM_ID=no_modem_userspace" >> "$GITHUB_ENV"
            echo "MODEM_LABEL=仅去除用户态modem" >> "$GITHUB_ENV"
          elif [ "$MODEM_INPUT" = "去除内核基带modem" ]; then
            echo "MODEM_ID=no_modem_kernel" >> "$GITHUB_ENV"
            echo "MODEM_LABEL=去除内核基带modem" >> "$GITHUB_ENV"
          else
            echo "::error::未知 Modem 选项: $MODEM_INPUT"
            exit 1
          fi

          echo "当前 Modem 选择: $MODEM_INPUT"

      - name: Show hardware info
        run: |
          chmod 755 ./scripts/show_hardware_info.sh
          ./scripts/show_hardware_info.sh

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: true

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install $(curl -fsSL https://raw.githubusercontent.com/xuxin1955/depend_ubuntu2204_openwrt/refs/heads/main/depend_ubuntu2204_openwrt)
          sudo -E apt-get -y install python3-pip zip unzip dos2unix jq

      - name: mkbootimg build
        run: |
          wget https://github.com/xuxin1955/depend_ubuntu2204_openwrt/releases/download/ubuntu_26.04_LTS_mkbootimg/mkbootimg_34.0.5-12build1_all.deb
          sudo dpkg -i mkbootimg_34.0.5-12build1_all.deb
          sudo apt-get install -f -y

          mkbootimg --help || true
          MKBOOTIMG_PATH=$(which mkbootimg)
          if [ -n "$MKBOOTIMG_PATH" ]; then
            echo "mkbootimg found at: $MKBOOTIMG_PATH"
            file "$MKBOOTIMG_PATH"
          else
            echo "❌ mkbootimg not found in PATH!"
          fi

          sudo timedatectl set-timezone "$TZ"
          sudo chmod 777 /mnt
          df -hT

      - name: Ensure Python build tools
        run: |
          python3 -m pip cache purge
          python3 -m pip install --upgrade --force-reinstall pip
          python3 -m pip install --upgrade --force-reinstall 'setuptools>=65' wheel
          python3 -m pip install --upgrade 'setuptools-scm>=8,<10'
          python3 -m pip install --upgrade cython packaging tomli
          python3 -m pip install Unidecode pyelftools
          python3 -m pip --version
          python3 -c "import setuptools.build_meta; print('setuptools.build_meta OK')"

      - name: Clone source code
        working-directory: /mnt
        run: |
          df -hT $PWD
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /mnt/openwrt $GITHUB_WORKSPACE/openwrt

      - name: files
        run: |
          [ -d files ] && cp -r files openwrt/files || true

      - name: Load custom feeds
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a

      - name: Remove conflicting packages from smpackage
        run: |
          rm -rf openwrt/feeds/smpackage/{base-files,dnsmasq,firewall*,fullconenat,libnftnl,nftables,ppp,opkg,ucl,upx,vsftpd*,miniupnpd-iptables,wireless-regdb}

      - name: Install feeds
        run: |
          cd openwrt
          ./scripts/feeds install -a -f

      - name: Load custom configuration
        run: |
          [ -e files ] && mv files openwrt/files || true
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: Apply modem userspace option before defconfig
        if: ${{ inputs.modem == '仅去除用户态modem' }}
        run: |
          cd openwrt
          echo "===== 仅去除用户态 modem：禁用 ModemManager/QMI/MBIM/LuCI 协议 ====="

          for p in \
            libmbim mbim-utils \
            libqmi qmi-utils \
            libqrtr-glib \
            modemmanager modemmanager-rpcd \
            luci-proto-mbim luci-proto-qmi luci-proto-modemmanager luci-app-modemmanager
          do
            sed -i "/^CONFIG_PACKAGE_${p}=/d" .config
            sed -i "/^# CONFIG_PACKAGE_${p} is not set/d" .config
            echo "# CONFIG_PACKAGE_${p} is not set" >> .config
          done

          grep -E "CONFIG_PACKAGE_(libmbim|mbim-utils|libqmi|qmi-utils|libqrtr-glib|modemmanager|modemmanager-rpcd|luci-proto-mbim|luci-proto-qmi|luci-proto-modemmanager|luci-app-modemmanager)" .config || true

      - name: Install extra packages
        if: ${{ inputs.extra_packages != '' }}
        run: |
          cd openwrt
          echo "=========================================="
          echo "User requested extra packages:"
          echo "${{ inputs.extra_packages }}"
          echo "=========================================="

          PACKAGES=$(echo '${{ inputs.extra_packages }}' | sed 's/,/ /g')
          for pkg in $PACKAGES; do
            if [ -n "$pkg" ]; then
              echo "Adding package to .config: CONFIG_PACKAGE_$pkg=y"
              echo "CONFIG_PACKAGE_$pkg=y" >> .config
            fi
          done

      - name: SSH 调试有效时间6h! 连接后输入q 输入exit即可退出，自动继续后续编译流程
        uses: mxschmitt/action-tmate@master
        if: ${{ inputs.ssh || contains(github.event.action, 'ssh') }}

      - name: Config defconfig
        id: config
        run: |
          cd openwrt
          make defconfig

      - name: Re-apply userspace no-modem after defconfig
        if: ${{ inputs.modem == '仅去除用户态modem' }}
        run: |
          cd openwrt
          echo "===== defconfig 后再次禁用用户态 modem 包 ====="

          for p in \
            libmbim mbim-utils \
            libqmi qmi-utils \
            libqrtr-glib \
            modemmanager modemmanager-rpcd \
            luci-proto-mbim luci-proto-qmi luci-proto-modemmanager luci-app-modemmanager
          do
            sed -i "/^CONFIG_PACKAGE_${p}=/d" .config
            sed -i "/^# CONFIG_PACKAGE_${p} is not set/d" .config
            echo "# CONFIG_PACKAGE_${p} is not set" >> .config
          done

          grep -E "CONFIG_PACKAGE_(libmbim|mbim-utils|libqmi|qmi-utils|libqrtr-glib|modemmanager|modemmanager-rpcd|luci-proto-mbim|luci-proto-qmi|luci-proto-modemmanager|luci-app-modemmanager)" .config || true

      - name: Fix iptables kernel module conflict
        run: |
          cd openwrt
          echo "===== 修复 kmod-iptables 与 kmod-nf-ipt 文件冲突 ====="

          # 新上游里 kmod-nf-ipt 会提供 x_tables.ko / ip_tables.ko。
          # 旧配置里同时选了 kmod-iptables，会在 package/install 阶段产生 check_data_file_clashes。
          for p in \
            kmod-iptables \
            kmod-ip6tables
          do
            sed -i "/^CONFIG_PACKAGE_${p}=/d" .config
            sed -i "/^# CONFIG_PACKAGE_${p} is not set/d" .config
            echo "# CONFIG_PACKAGE_${p} is not set" >> .config
          done

          echo "===== iptables/nft compat 相关配置 ====="
          grep -E "CONFIG_PACKAGE_(kmod-iptables|kmod-ip6tables|kmod-nf-ipt|kmod-nf-ip6|kmod-ipt-core|kmod-nft-compat|iptables|iptables-zz-legacy|nftables)" .config || true

      - name: Prepare kernel source for no-modem
        if: ${{ inputs.modem == '去除内核基带modem' }}
        run: |
          cd openwrt
          make target/linux/prepare V=s

      - name: Patch prepared kernel DTS for no-modem
        if: ${{ inputs.modem == '去除内核基带modem' }}
        run: |
          cd openwrt

          python3 <<'PY'
          from pathlib import Path
          import re

          search_roots = []
          for p in Path("build_dir").glob("target-*/linux-*/linux-*"):
              dts = p / "arch/arm64/boot/dts"
              if dts.exists():
                  search_roots.append(dts)

          tl = Path("target/linux")
          if tl.exists():
              search_roots.append(tl)

          print("===== DTS search roots =====")
          for r in search_roots:
              print(r)

          remoteproc_keywords = [
              "qcom,msm8916-mss-pil",
              "qcom,q6v5-mss",
              "qcom,msm8916-mss",
              "mpss-pil",
              "remoteproc@4080000",
              "4080000.remoteproc",
              "4080000",
          ]

          reserved_keywords = [
              "mpss@",
              "mba@",
              "modem@",
              "rmtfs@",
              "mpss_mem",
              "mba_mem",
              "modem_mem",
              "rmtfs_mem",
          ]

          def find_matching_brace(text, start):
              depth = 0
              for i in range(start, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return i
              return -1

          def find_node_start(text, idx):
              prev_brace = text.rfind("{", 0, idx + 1)
              next_brace = text.find("{", idx)
              if next_brace != -1 and next_brace - idx < 260:
                  return next_brace
              return prev_brace

          def block_header(text, start):
              prev1 = text.rfind("};", 0, start)
              prev2 = text.rfind("\n", 0, start)
              prev = max(prev1, prev2)
              return text[prev + 1:start].strip()

          def disable_block(text, start, end):
              block = text[start + 1:end]
              if re.search(r'status\s*=', block):
                  block = re.sub(r'status\s*=\s*"[^"]*"\s*;', 'status = "disabled";', block, count=1)
                  return text[:start + 1] + block + text[end:]
              return text[:start + 1] + '\n\t\tstatus = "disabled";' + text[start + 1:]

          def collect_blocks(text, keywords):
              blocks = set()
              for kw in keywords:
                  pos = 0
                  while True:
                      idx = text.find(kw, pos)
                      if idx < 0:
                          break

                      start = find_node_start(text, idx)
                      if start != -1:
                          end = find_matching_brace(text, start)
                          if end != -1:
                              header = block_header(text, start)
                              sample = (header + "\n" + text[start:end+1]).lower()
                              if any(x in sample for x in ["remoteproc", "mss", "mpss", "mba", "modem", "rmtfs"]):
                                  blocks.add((start, end, kw, header))

                      pos = idx + len(kw)
              return blocks

          changed_files = []
          hit_files = []

          for root in search_roots:
              for p in root.rglob("*"):
                  if p.suffix not in (".dts", ".dtsi"):
                      continue

                  try:
                      text = p.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue

                  low = text.lower()
                  if not any(k.lower() in low for k in remoteproc_keywords + reserved_keywords):
                      continue

                  hit_files.append(str(p))
                  original = text
                  blocks = []
                  blocks.extend(list(collect_blocks(text, remoteproc_keywords)))
                  blocks.extend(list(collect_blocks(text, reserved_keywords)))

                  for start, end, kw, header in sorted(set(blocks), reverse=True):
                      text = disable_block(text, start, end)
                      print(f"disabled node in {p}: keyword={kw}, header={header[:160]}")

                  if text != original:
                      p.write_text(text, encoding="utf-8")
                      changed_files.append(str(p))

          print("===== DTS matched files =====")
          if hit_files:
              for f in sorted(set(hit_files)):
                  print(f)
          else:
              print("No matched DTS/DTSI files.")

          print("===== DTS no_modem_kernel patch result =====")
          if changed_files:
              for f in sorted(set(changed_files)):
                  print(f)
          else:
              print("No DTS/DTSI nodes were patched. This build will NOT release modem reserved memory.")
              raise SystemExit(1)
          PY

      - name: Download package
        id: package
        run: |
          cd openwrt
          make download -j4 V=s
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 查看 openwrt 目录
        run: |
          ls -la openwrt/
          ls -l .config || true
          ls -la openwrt/.config

      - name: 自动上传最新源码生成.config编译配置
        uses: actions/upload-artifact@main
        with:
          name: build-config
          path: |
            ${{ github.workspace }}/openwrt/.config
            ${{ github.workspace }}/openwrt/feeds.conf.default
          include-hidden-files: true

      - name: Compile the firmware
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Get kernel version
        run: |
          KERNEL_VER=$(cat /mnt/openwrt/build_dir/target-*/linux-*/linux-*/.kernelversion 2>/dev/null | head -1 || echo "未知")
          echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV

      - name: Check space usage
        if: (!cancelled())
        run: |
          df -hT

      - name: Fix Git buffer
        run: |
          git config --global http.postBuffer 524288000

      - name: Upload bin directory
        uses: actions/upload-artifact@main
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: Organize files
        id: organize
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages

          PROFILE=${{ github.event.inputs.profile }}
          MODEM="${MODEM_ID}"

          mkdir -p flash_package

          BOOT_IMG=$(ls *boot.img.gz *boot.img 2>/dev/null | head -1)
          SYSTEM_IMG=$(ls *system.img.gz *system.img 2>/dev/null | head -1)

          if [ -z "$BOOT_IMG" ] || [ -z "$SYSTEM_IMG" ]; then
            echo "::error::固件文件未找到，编译可能失败！当前目录文件："
            ls -la
            exit 1
          fi

          cp "$BOOT_IMG" flash_package/boot.img.gz
          cp "$SYSTEM_IMG" flash_package/system.img.gz

          gzip -dk flash_package/boot.img.gz
          gzip -dk flash_package/system.img.gz
          rm flash_package/boot.img.gz flash_package/system.img.gz

          cp -r $GITHUB_WORKSPACE/刷机脚本/. flash_package/

          unix2dos flash_package/*.bat 2>/dev/null || sed -i 's/\r//' flash_package/*.bat && sed -i 's/$/\r/' flash_package/*.bat

          ZIP_NAME="OpenWrt_${PROFILE}_${MODEM}${{ env.FILE_DATE }}_刷机包.zip"
          cd flash_package && zip -r "../$ZIP_NAME" . && cd ..

          mkdir -p release_files
          mv "$ZIP_NAME" release_files/

          echo "FIRMWARE=$PWD/release_files" >> $GITHUB_ENV
          echo "FIRMWARE_ZIP=$PWD/release_files/$ZIP_NAME" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware directory
        uses: actions/upload-artifact@main
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}_${{ env.MODEM_ID }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE_ZIP }}

      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
        run: |
          PROFILE=${{ github.event.inputs.profile }}
          MODEM="${MODEM_ID}"
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")-${PROFILE}-${MODEM}" >> $GITHUB_OUTPUT

          touch release.txt
          {
            echo "## Immortalwrt master分支 高通410系列 · ${PROFILE} · ${MODEM_LABEL}"
            echo ""
            echo "| 项目 | 信息 |"
            echo "|------|------|"
            echo "| 编译者 | ${{ github.actor }} |"
            echo "| 机型 | ${PROFILE} |"
            echo "| Modem选项 | ${MODEM_LABEL} |"
            echo "| 内部标识 | ${MODEM} |"
            echo "| 内核版本 | ${{ env.KERNEL_VER }} |"
            echo "| 管理地址 | 192.168.1.1 |"
            echo "| 默认用户 | root |"
            echo "| 默认密码 | 空 |"
            echo ""
            echo "### Modem 说明"
            echo "- 保留modem：原始配置，不额外修改。"
            echo "- 仅去除用户态modem：禁用 ModemManager/QMI/MBIM/LuCI modem 协议。"
            echo "- 去除内核基带modem：在 kernel prepare 后 patch 实际内核 DTS，尝试禁用 4080000.remoteproc/MPSS/reserved-memory；如果没 patch 到会直接失败。"
            echo ""
            EXTRA=$(echo '${{ inputs.extra_packages }}' | sed 's/,/ /g' | tr ' ' '\n' | sed '/^$/d')
            if [ -n "$EXTRA" ]; then
              echo "### 额外添加的包"
              echo "$EXTRA" | sed 's/^/- /'
            else
              echo "### 额外添加的包"
              echo "无"
            fi
          } >> release.txt

          echo "status=success" >> $GITHUB_OUTPUT

      - name: Generate file list
        if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
        run: |
          find ${{ env.FIRMWARE }} -type f > file_list.txt
          echo "Collected files:"
          cat file_list.txt
          test -s file_list.txt || { echo "::error::No firmware files found"; exit 1; }

      - name: Upload firmware to release
        if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
        uses: ncipollo/release-action@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ steps.tag.outputs.release_tag }}
          bodyFile: release.txt
          artifacts: ${{ env.FIRMWARE_ZIP }}
          artifactErrorsFailBuild: false
          allowUpdates: true
          draft: false
          prerelease: false

      - name: Delete old workflow runs via GitHub API
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETAIN_DAYS: 7
          KEEP_MINIMUM_RUNS: 5
        run: |
          RUNS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100")

          CUTOFF=$(date -d "-${RETAIN_DAYS} days" +%s)

          DEL_IDS=$(echo "$RUNS" | jq -r --arg cutoff "$CUTOFF" --argjson keep "$KEEP_MINIMUM_RUNS" '
            [.workflow_runs[]
             | select((now - (.created_at | fromdateiso8601)) > ($cutoff | tonumber))
             | {id, created_at}
            ]
            | sort_by(.created_at)
            | .[:-$keep]
            | .[].id
          ')

          if [[ -z "$DEL_IDS" ]]; then
            echo "No old runs to delete."
          else
            echo "$DEL_IDS" | while read run_id; do
              echo "Deleting run $run_id"
              curl -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id"
            done
          fi
