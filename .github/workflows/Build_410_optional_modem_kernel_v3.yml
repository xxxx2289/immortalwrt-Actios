name: Build_imm_高通410系列_可选Modem

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: '是否开启 SSH 调试'
        required: false
        default: false
        type: boolean
      profile:
        description: '选择要编译的机型'
        type: choice
        options: [ufi003, ufi001c, ufi001b, ufi103s, jz02v10, qrzl903, w001, uz801, mf32, mf601, wf2, sp970v11, sp970v10]
        default: ufi003
        required: true
      modem:
        description: 'Modem 版本选择'
        type: choice
        options: [with_modem, no_modem_userspace, no_modem_kernel]
        default: with_modem
        required: true
      upstream:
        description: '上游源码仓库'
        type: choice
        options: [lkiuyu/immortalwrt]
        default: lkiuyu/immortalwrt
        required: true
      custom_hash:
        description: '指定上游 hash，留空则优先使用 upstream_lock.txt'
        required: false
        default: ''
        type: string
      extra_packages:
        description: '额外包名，逗号或空格分隔，留空则不添加'
        required: false
        default: ''
        type: string

permissions:
  contents: write

env:
  REPO_URL: https://github.com/${{ github.event.inputs.upstream }}
  REPO_BRANCH: master
  CONFIG_FILE: ${{ format('config/{0}.config', github.event.inputs.profile) }}
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: true

      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install $(curl -fsSL https://raw.githubusercontent.com/xuxin1955/depend_ubuntu2204_openwrt/refs/heads/main/depend_ubuntu2204_openwrt)
          sudo -E apt-get -y install zip unzip dos2unix jq python3-pip
          sudo timedatectl set-timezone "$TZ"
          sudo chmod 777 /mnt
          df -hT

      - name: Install mkbootimg
        run: |
          wget -q https://github.com/xuxin1955/depend_ubuntu2204_openwrt/releases/download/ubuntu_26.04_LTS_mkbootimg/mkbootimg_34.0.5-12build1_all.deb
          sudo dpkg -i mkbootimg_34.0.5-12build1_all.deb || sudo apt-get install -f -y
          which mkbootimg || true

      - name: Ensure Python build tools
        run: |
          python3 -m pip cache purge || true
          python3 -m pip install --upgrade --force-reinstall pip
          python3 -m pip install --upgrade --force-reinstall 'setuptools>=65' wheel
          python3 -m pip install --upgrade 'setuptools-scm>=8,<10'
          python3 -m pip install --upgrade cython packaging tomli Unidecode pyelftools
          python3 -c "import setuptools.build_meta; print('setuptools.build_meta OK')"

      - name: Decide upstream hash
        id: lock
        run: |
          CUSTOM_HASH="${{ github.event.inputs.custom_hash }}"
          if [ -n "$CUSTOM_HASH" ]; then
            echo "locked_hash=$CUSTOM_HASH" >> "$GITHUB_OUTPUT"
            echo "使用用户指定 hash: $CUSTOM_HASH"
          elif [ -f upstream_lock.txt ]; then
            HASH="$(head -n1 upstream_lock.txt | tr -d '[:space:]')"
            echo "locked_hash=$HASH" >> "$GITHUB_OUTPUT"
            echo "使用 upstream_lock.txt 锁定 hash: $HASH"
          else
            echo "locked_hash=" >> "$GITHUB_OUTPUT"
            echo "没有 upstream_lock.txt，使用上游最新 master"
          fi

      - name: Clone upstream source
        working-directory: /mnt
        run: |
          git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt
          if [ -n "${{ steps.lock.outputs.locked_hash }}" ]; then
            cd /mnt/openwrt
            git checkout "${{ steps.lock.outputs.locked_hash }}"
          fi
          ln -sf /mnt/openwrt "$GITHUB_WORKSPACE/openwrt"

      - name: Copy local config and overlay
        run: |
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "::error::配置文件不存在: $CONFIG_FILE"
            exit 1
          fi
          cp -f "$CONFIG_FILE" openwrt/.config
          if [ -d files ]; then
            cp -r files openwrt/files
          fi
          echo "===== selected profile config ====="
          grep -E "CONFIG_TARGET_.*DEVICE_.*=y|CONFIG_TARGET_PROFILE" openwrt/.config || true

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a

      - name: Install feeds
        run: |
          cd openwrt
          ./scripts/feeds install -a -f

      - name: Install extra packages
        if: ${{ inputs.extra_packages != '' }}
        run: |
          cd openwrt
          PACKAGES=$(echo '${{ inputs.extra_packages }}' | sed 's/,/ /g')
          echo "===== extra packages ====="
          echo "$PACKAGES"
          for pkg in $PACKAGES; do
            if [ -n "$pkg" ]; then
              sed -i "/^CONFIG_PACKAGE_${pkg}=/d" .config
              sed -i "/^# CONFIG_PACKAGE_${pkg} is not set/d" .config
              echo "CONFIG_PACKAGE_${pkg}=y" >> .config
            fi
          done

      - name: Apply modem option before defconfig
        run: |
          cd openwrt
          echo "===== MODEM OPTION: ${{ inputs.modem }} ====="

          # 修复 glib2 拆包依赖，只修改临时编译目录，不改你的仓库源码。
          for f in \
            feeds/packages/libs/libmbim/Makefile \
            feeds/packages/libs/libqrtr-glib/Makefile \
            feeds/packages/libs/libqmi/Makefile \
            feeds/packages/net/modemmanager/Makefile
          do
            if [ -f "$f" ]; then
              sed -i -E 's/\+glib2([[:space:]\\]|$)/+glib2-core +glib2-gobject +glib2-gio\1/g' "$f"
            fi
          done
          if [ -f feeds/packages/libs/glib2/Makefile ]; then
            sed -i 's/DEPENDS:+glib2-gthread/DEPENDS:=+glib2-gthread/g' feeds/packages/libs/glib2/Makefile
          fi
          for p in glib2-core glib2-gmodule glib2-gobject glib2-gio glib2-gthread; do
            sed -i "/^CONFIG_PACKAGE_${p}=/d" .config
            sed -i "/^# CONFIG_PACKAGE_${p} is not set/d" .config
            echo "CONFIG_PACKAGE_${p}=y" >> .config
          done

          if [ "${{ inputs.modem }}" != "with_modem" ]; then
            for p in \
              libmbim mbim-utils \
              libqmi qmi-utils \
              libqrtr-glib libqrtr qrtr-ns \
              modemmanager modemmanager-rpcd \
              luci-proto-mbim luci-proto-qmi luci-proto-modemmanager luci-app-modemmanager \
              qmi-modem-410-init
            do
              sed -i "/^CONFIG_PACKAGE_${p}=/d" .config
              sed -i "/^# CONFIG_PACKAGE_${p} is not set/d" .config
              echo "# CONFIG_PACKAGE_${p} is not set" >> .config
            done
          fi

          echo "===== GLib dependency patch check ====="
          grep -n "DEPENDS" feeds/packages/libs/libmbim/Makefile || true
          grep -n "DEPENDS" feeds/packages/libs/libqrtr-glib/Makefile || true
          grep -n "DEPENDS" feeds/packages/libs/libqmi/Makefile || true
          grep -n "DEPENDS" feeds/packages/net/modemmanager/Makefile || true
          echo "===== modem package config before defconfig ====="
          grep -E "CONFIG_PACKAGE_(libmbim|mbim-utils|libqmi|qmi-utils|libqrtr-glib|libqrtr|qrtr-ns|modemmanager|modemmanager-rpcd|luci-proto-mbim|luci-proto-qmi|luci-proto-modemmanager|luci-app-modemmanager|qmi-modem-410-init)" .config || true

      - name: Patch DTS for no_modem_kernel
        if: ${{ inputs.modem == 'no_modem_kernel' }}
        run: |
          cd openwrt
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("target/linux")
          if not root.exists():
              print("target/linux not found")
              raise SystemExit(0)

          remoteproc_keywords = [
              "qcom,msm8916-mss-pil",
              "qcom,q6v5-mss",
              "qcom,msm8916-mss",
              "mpss-pil",
              "remoteproc@4080000",
          ]
          reserved_keywords = ["mpss@", "mba@", "modem@", "mpss_mem", "mba_mem", "modem_mem"]

          def find_matching_brace(text, start):
              depth = 0
              for i in range(start, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return i
              return -1

          def block_header(text, start):
              prev = max(text.rfind("};", 0, start), text.rfind("\n", 0, start))
              return text[prev + 1:start].strip()

          def disable_block(text, start, end):
              block = text[start + 1:end]
              if re.search(r'status\s*=', block):
                  block = re.sub(r'status\s*=\s*"[^"]*"\s*;', 'status = "disabled";', block, count=1)
                  return text[:start + 1] + block + text[end:]
              return text[:start + 1] + '\n\t\tstatus = "disabled";' + text[start + 1:]

          def collect_blocks(text, keywords):
              blocks = set()
              for kw in keywords:
                  pos = 0
                  while True:
                      idx = text.find(kw, pos)
                      if idx < 0:
                          break
                      next_brace = text.find("{", idx)
                      prev_brace = text.rfind("{", 0, idx)
                      start = -1
                      if next_brace != -1 and next_brace - idx < 220:
                          start = next_brace
                      elif prev_brace != -1:
                          start = prev_brace
                      if start != -1:
                          end = find_matching_brace(text, start)
                          if end != -1:
                              blocks.add((start, end, kw, block_header(text, start)))
                      pos = idx + len(kw)
              return blocks

          changed_files = []
          for p in root.rglob("*"):
              if p.suffix not in (".dts", ".dtsi"):
                  continue
              try:
                  text = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              original = text
              blocks = []
              blocks.extend(list(collect_blocks(text, remoteproc_keywords)))
              if "reserved-memory" in text:
                  blocks.extend(list(collect_blocks(text, reserved_keywords)))
              for start, end, kw, header in sorted(set(blocks), reverse=True):
                  text = disable_block(text, start, end)
                  print(f"disabled node in {p}: keyword={kw}, header={header[:120]}")
              if text != original:
                  p.write_text(text, encoding="utf-8")
                  changed_files.append(str(p))

          print("===== DTS no_modem_kernel patch result =====")
          if changed_files:
              for f in changed_files:
                  print(f)
          else:
              print("No DTS/DTSI nodes were patched. Please check target/linux path or upstream DTS layout.")
          PY

      - name: SSH debug
        uses: mxschmitt/action-tmate@v3
        if: ${{ inputs.ssh }}

      - name: Make defconfig
        run: |
          cd openwrt
          make defconfig

      - name: Re-apply no_modem after defconfig
        if: ${{ inputs.modem != 'with_modem' }}
        run: |
          cd openwrt
          for p in \
            libmbim mbim-utils \
            libqmi qmi-utils \
            libqrtr-glib libqrtr qrtr-ns \
            modemmanager modemmanager-rpcd \
            luci-proto-mbim luci-proto-qmi luci-proto-modemmanager luci-app-modemmanager \
            qmi-modem-410-init
          do
            sed -i "/^CONFIG_PACKAGE_${p}=/d" .config
            sed -i "/^# CONFIG_PACKAGE_${p} is not set/d" .config
            echo "# CONFIG_PACKAGE_${p} is not set" >> .config
          done
          echo "===== modem package config after defconfig ====="
          grep -E "CONFIG_PACKAGE_(libmbim|mbim-utils|libqmi|qmi-utils|libqrtr-glib|libqrtr|qrtr-ns|modemmanager|modemmanager-rpcd|luci-proto-mbim|luci-proto-qmi|luci-proto-modemmanager|luci-app-modemmanager|qmi-modem-410-init)" .config || true

      - name: Download packages
        run: |
          cd openwrt
          make download -j4 V=s
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Upload build config
        uses: actions/upload-artifact@v4
        with:
          name: build-config-${{ github.event.inputs.profile }}-${{ github.event.inputs.modem }}
          path: |
            ${{ github.workspace }}/openwrt/.config
            ${{ github.workspace }}/openwrt/feeds.conf.default
          include-hidden-files: true

      - name: Compile firmware
        id: compile
        run: |
          cd openwrt
          echo "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> "$GITHUB_OUTPUT"
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME || true
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

      - name: Get kernel version
        if: steps.compile.outputs.status == 'success'
        run: |
          KERNEL_VER=$(find /mnt/openwrt/build_dir -path '*/linux-*/.kernelversion' -type f -print -quit 2>/dev/null | xargs -r cat || true)
          [ -n "$KERNEL_VER" ] || KERNEL_VER="未知"
          echo "KERNEL_VER=$KERNEL_VER" >> "$GITHUB_ENV"

      - name: Check space usage
        if: always()
        run: df -hT

      - name: Organize files
        id: organize
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          PROFILE="${{ github.event.inputs.profile }}"
          MODEM="${{ github.event.inputs.modem }}"
          mkdir -p flash_package
          BOOT_IMG=$(ls *boot.img.gz *boot.img 2>/dev/null | head -1 || true)
          SYSTEM_IMG=$(ls *system.img.gz *system.img 2>/dev/null | head -1 || true)
          if [ -n "$BOOT_IMG" ] && [ -n "$SYSTEM_IMG" ]; then
            cp "$BOOT_IMG" flash_package/boot.img.gz
            cp "$SYSTEM_IMG" flash_package/system.img.gz
            gzip -dk flash_package/boot.img.gz
            gzip -dk flash_package/system.img.gz
            rm -f flash_package/boot.img.gz flash_package/system.img.gz
            if [ -d "$GITHUB_WORKSPACE/刷机脚本" ]; then
              cp -r "$GITHUB_WORKSPACE/刷机脚本/." flash_package/
            fi
            unix2dos flash_package/*.bat 2>/dev/null || true
            ZIP_NAME="OpenWrt_${PROFILE}_${MODEM}${{ env.FILE_DATE }}_刷机包.zip"
            cd flash_package
            zip -r "../$ZIP_NAME" .
            cd ..
          else
            echo "没有找到 boot/system 镜像，直接上传 targets 目录内现有文件。"
          fi
          mkdir -p release_files
          [ -n "${ZIP_NAME:-}" ] && [ -f "$ZIP_NAME" ] && mv "$ZIP_NAME" release_files/ || true
          cp * release_files/ 2>/dev/null || true
          echo "FIRMWARE=$PWD/release_files" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}_${{ github.event.inputs.modem }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release body
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
        run: |
          PROFILE="${{ github.event.inputs.profile }}"
          MODEM="${{ github.event.inputs.modem }}"
          TAG="$(date +"%Y.%m.%d-%H%M")-${PROFILE}-${MODEM}"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "## ImmortalWrt 高通410系列 · ${PROFILE} · ${MODEM}"
            echo ""
            echo "| 项目 | 信息 |"
            echo "|------|------|"
            echo "| 编译者 | ${{ github.actor }} |"
            echo "| 机型 | ${PROFILE} |"
            echo "| Modem 选项 | ${MODEM} |"
            echo "| 内核版本 | ${{ env.KERNEL_VER }} |"
            echo "| 默认用户 | root |"
            echo "| 默认密码 | 空 |"
            echo ""
            echo "### Modem 说明"
            echo "- with_modem：保留 modem/蜂窝拨号组件。"
            echo "- no_modem_userspace：只去掉 ModemManager/QMI/MBIM 用户态组件。"
            echo "- no_modem_kernel：去掉用户态组件，并临时 patch DTS 尝试禁用 4080000.remoteproc/MPSS。"
            echo ""
            echo "### 额外添加的包"
            EXTRA=$(echo '${{ inputs.extra_packages }}' | sed 's/,/ /g' | tr ' ' '\n' | sed '/^$/d')
            if [ -n "$EXTRA" ]; then
              echo "$EXTRA" | sed 's/^/- /'
            else
              echo "无"
            fi
          } > release.txt

      - name: Upload firmware to release
        uses: ncipollo/release-action@v1
        if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ steps.tag.outputs.release_tag }}
          bodyFile: release.txt
          artifacts: ${{ env.FIRMWARE }}/**/*
          artifactErrorsFailBuild: false
          allowUpdates: true
          draft: false
          prerelease: false
