name: Build_imm_高通410系列_可选Modem

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: '是否开启 SSH 调试'
        required: false
        default: false
        type: boolean

      profile:
        description: '选择要编译的机型'
        type: choice
        options:
          - ufi003
          - ufi001c
          - ufi001b
          - ufi103s
          - jz02v10
          - qrzl903
          - w001
          - uz801
          - mf32
          - mf601
          - wf2
          - sp970v11
          - sp970v10
        default: ufi003
        required: true

      modem:
        description: 'Modem 版本选择'
        type: choice
        options:
          - 保留modem
          - 仅去除用户态modem
          - 去除内核基带modem
        default: 保留modem
        required: true

      upstream:
        description: '上游源码仓库'
        type: choice
        options:
          - lkiuyu/immortalwrt
        default: lkiuyu/immortalwrt
        required: true

      custom_hash:
        description: '指定上游 hash，留空则优先使用 upstream_lock.txt'
        required: false
        default: ''
        type: string

      extra_packages:
        description: '额外包名，逗号或空格分隔，留空则不添加'
        required: false
        default: ''
        type: string

permissions:
  contents: write

env:
  REPO_URL: https://github.com/${{ github.event.inputs.upstream }}
  REPO_BRANCH: master
  CONFIG_FILE: ${{ format('config/{0}.config', github.event.inputs.profile) }}
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Normalize modem option
        run: |
          MODEM_INPUT='${{ github.event.inputs.modem }}'

          if [ "$MODEM_INPUT" = "保留modem" ]; then
            echo "MODEM_ID=with_modem" >> "$GITHUB_ENV"
            echo "MODEM_LABEL=保留modem" >> "$GITHUB_ENV"
          elif [ "$MODEM_INPUT" = "仅去除用户态modem" ]; then
            echo "MODEM_ID=no_modem_userspace" >> "$GITHUB_ENV"
            echo "MODEM_LABEL=仅去除用户态modem" >> "$GITHUB_ENV"
          elif [ "$MODEM_INPUT" = "去除内核基带modem" ]; then
            echo "MODEM_ID=no_modem_kernel" >> "$GITHUB_ENV"
            echo "MODEM_LABEL=去除内核基带modem" >> "$GITHUB_ENV"
          else
            echo "::error::未知 Modem 选项: $MODEM_INPUT"
            exit 1
          fi

          echo "当前选择: $MODEM_INPUT"

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: true

      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install $(curl -fsSL https://raw.githubusercontent.com/xuxin1955/depend_ubuntu2204_openwrt/refs/heads/main/depend_ubuntu2204_openwrt)
          sudo -E apt-get -y install zip unzip dos2unix jq python3-pip
          sudo timedatectl set-timezone "$TZ"
          sudo chmod 777 /mnt
          df -hT

      - name: Install mkbootimg
        run: |
          wget -q https://github.com/xuxin1955/depend_ubuntu2204_openwrt/releases/download/ubuntu_26.04_LTS_mkbootimg/mkbootimg_34.0.5-12build1_all.deb
          sudo dpkg -i mkbootimg_34.0.5-12build1_all.deb || sudo apt-get install -f -y
          which mkbootimg || true

      - name: Ensure Python build tools
        run: |
          python3 -m pip cache purge || true
          python3 -m pip install --upgrade --force-reinstall pip
          python3 -m pip install --upgrade --force-reinstall 'setuptools>=65' wheel
          python3 -m pip install --upgrade 'setuptools-scm>=8,<10'
          python3 -m pip install --upgrade cython packaging tomli Unidecode pyelftools
          python3 -c "import setuptools.build_meta; print('setuptools.build_meta OK')"

      - name: Decide upstream hash
        id: lock
        run: |
          CUSTOM_HASH="${{ github.event.inputs.custom_hash }}"
          if [ -n "$CUSTOM_HASH" ]; then
            echo "locked_hash=$CUSTOM_HASH" >> "$GITHUB_OUTPUT"
            echo "使用用户指定 hash: $CUSTOM_HASH"
          elif [ -f upstream_lock.txt ]; then
            HASH="$(head -n1 upstream_lock.txt | tr -d '[:space:]')"
            echo "locked_hash=$HASH" >> "$GITHUB_OUTPUT"
            echo "使用 upstream_lock.txt 锁定 hash: $HASH"
          else
            echo "locked_hash=" >> "$GITHUB_OUTPUT"
            echo "没有 upstream_lock.txt，使用上游最新 master"
          fi

      - name: Clone upstream source
        working-directory: /mnt
        run: |
          git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt
          if [ -n "${{ steps.lock.outputs.locked_hash }}" ]; then
            cd /mnt/openwrt
            git checkout "${{ steps.lock.outputs.locked_hash }}"
          fi
          ln -sf /mnt/openwrt "$GITHUB_WORKSPACE/openwrt"

      - name: Copy local config and overlay
        run: |
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "::error::配置文件不存在: $CONFIG_FILE"
            exit 1
          fi

          cp -f "$CONFIG_FILE" openwrt/.config

          if [ -d files ]; then
            cp -r files openwrt/files
          fi

          echo "===== selected profile config ====="
          grep -E "CONFIG_TARGET_.*DEVICE_.*=y|CONFIG_TARGET_PROFILE" openwrt/.config || true

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a

      - name: Install feeds
        run: |
          cd openwrt
          ./scripts/feeds install -a -f

      - name: Install extra packages
        if: ${{ inputs.extra_packages != '' }}
        run: |
          cd openwrt
          PACKAGES=$(echo '${{ inputs.extra_packages }}' | sed 's/,/ /g')
          echo "===== extra packages ====="
          echo "$PACKAGES"
          for pkg in $PACKAGES; do
            if [ -n "$pkg" ]; then
              sed -i "/^CONFIG_PACKAGE_${pkg}=/d" .config
              sed -i "/^# CONFIG_PACKAGE_${pkg} is not set/d" .config
              echo "CONFIG_PACKAGE_${pkg}=y" >> .config
            fi
          done

      - name: Apply modem option before defconfig
        run: |
          cd openwrt
          echo "===== Modem 选项: $MODEM_LABEL / $MODEM_ID ====="

          # 保守策略：
          # 保留modem：完全按原始配置编译。
          # 仅去除用户态modem：只删除 ModemManager/QMI/MBIM/LuCI 协议。
          # 去除内核基带modem：不删包，只 patch DTS，避免破坏 rmtfs/qrtr/qcom-firmware 依赖链。
          if [ "$MODEM_ID" = "no_modem_userspace" ]; then
            for p in \
              libmbim mbim-utils \
              libqmi qmi-utils \
              libqrtr-glib \
              modemmanager modemmanager-rpcd \
              luci-proto-mbim luci-proto-qmi luci-proto-modemmanager luci-app-modemmanager
            do
              sed -i "/^CONFIG_PACKAGE_${p}=/d" .config
              sed -i "/^# CONFIG_PACKAGE_${p} is not set/d" .config
              echo "# CONFIG_PACKAGE_${p} is not set" >> .config
            done
          fi

          echo "===== key modem package config before defconfig ====="
          grep -E "CONFIG_PACKAGE_(libmbim|mbim-utils|libqmi|qmi-utils|libqrtr-glib|libqrtr|qrtr|qrtr-ns|rmtfs|wwan|comgt|comgt-ncm|modemmanager|modemmanager-rpcd|luci-proto-mbim|luci-proto-qmi|luci-proto-modemmanager|luci-app-modemmanager|qmi-modem-410-init|kmod-qcom-rproc-modem|kmod-rpmsg-wwan-ctrl|qcom-msm8916-modem)" .config || true

      - name: Patch DTS for 去除内核基带modem
        if: ${{ inputs.modem == '去除内核基带modem' }}
        run: |
          cd openwrt
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("target/linux")
          remoteproc_keywords = [
              "qcom,msm8916-mss-pil",
              "qcom,q6v5-mss",
              "qcom,msm8916-mss",
              "mpss-pil",
              "remoteproc@4080000",
              "4080000.remoteproc",
          ]

          reserved_keywords = [
              "mpss@",
              "mba@",
              "modem@",
              "mpss_mem",
              "mba_mem",
              "modem_mem",
          ]

          def find_matching_brace(text, start):
              depth = 0
              for i in range(start, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return i
              return -1

          def block_header(text, start):
              prev1 = text.rfind("};", 0, start)
              prev2 = text.rfind("\n", 0, start)
              prev = max(prev1, prev2)
              return text[prev + 1:start].strip()

          def disable_block(text, start, end):
              block = text[start + 1:end]
              if re.search(r'status\s*=', block):
                  block = re.sub(r'status\s*=\s*"[^"]*"\s*;', 'status = "disabled";', block, count=1)
                  return text[:start + 1] + block + text[end:]
              return text[:start + 1] + '\n\t\tstatus = "disabled";' + text[start + 1:]

          def collect_blocks(text, keywords):
              blocks = set()
              for kw in keywords:
                  pos = 0
                  while True:
                      idx = text.find(kw, pos)
                      if idx < 0:
                          break

                      next_brace = text.find("{", idx)
                      prev_brace = text.rfind("{", 0, idx)
                      start = -1

                      if next_brace != -1 and next_brace - idx < 260:
                          start = next_brace
                      elif prev_brace != -1:
                          start = prev_brace

                      if start != -1:
                          end = find_matching_brace(text, start)
                          if end != -1:
                              blocks.add((start, end, kw, block_header(text, start)))

                      pos = idx + len(kw)
              return blocks

          changed_files = []
          for p in root.rglob("*"):
              if p.suffix not in (".dts", ".dtsi"):
                  continue

              try:
                  text = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              original = text
              blocks = []

              blocks.extend(list(collect_blocks(text, remoteproc_keywords)))

              if "reserved-memory" in text:
                  blocks.extend(list(collect_blocks(text, reserved_keywords)))

              for start, end, kw, header in sorted(set(blocks), reverse=True):
                  text = disable_block(text, start, end)
                  print(f"disabled node in {p}: keyword={kw}, header={header[:120]}")

              if text != original:
                  p.write_text(text, encoding="utf-8")
                  changed_files.append(str(p))

          print("===== DTS no_modem_kernel patch result =====")
          if changed_files:
              for f in changed_files:
                  print(f)
          else:
              print("No DTS/DTSI nodes were patched. Please check target/linux path or upstream DTS layout.")
          PY

      - name: SSH debug
        uses: mxschmitt/action-tmate@v3
        if: ${{ inputs.ssh }}

      - name: Make defconfig
        run: |
          cd openwrt
          make defconfig

      - name: Re-apply userspace no_modem after defconfig
        if: ${{ inputs.modem == '仅去除用户态modem' }}
        run: |
          cd openwrt
          for p in \
            libmbim mbim-utils \
            libqmi qmi-utils \
            libqrtr-glib \
            modemmanager modemmanager-rpcd \
            luci-proto-mbim luci-proto-qmi luci-proto-modemmanager luci-app-modemmanager
          do
            sed -i "/^CONFIG_PACKAGE_${p}=/d" .config
            sed -i "/^# CONFIG_PACKAGE_${p} is not set/d" .config
            echo "# CONFIG_PACKAGE_${p} is not set" >> .config
          done

          echo "===== userspace modem package config after defconfig ====="
          grep -E "CONFIG_PACKAGE_(libmbim|mbim-utils|libqmi|qmi-utils|libqrtr-glib|modemmanager|modemmanager-rpcd|luci-proto-mbim|luci-proto-qmi|luci-proto-modemmanager|luci-app-modemmanager)" .config || true

      - name: Download packages
        run: |
          cd openwrt
          make download -j4 V=s
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Upload build config
        uses: actions/upload-artifact@v4
        with:
          name: build-config-${{ github.event.inputs.profile }}-${{ env.MODEM_ID }}
          path: |
            ${{ github.workspace }}/openwrt/.config
            ${{ github.workspace }}/openwrt/feeds.conf.default
          include-hidden-files: true

      - name: Compile firmware
        id: compile
        run: |
          cd openwrt
          echo "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> "$GITHUB_OUTPUT"

          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME || true
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

      - name: Get kernel version
        if: steps.compile.outputs.status == 'success'
        run: |
          KERNEL_VER=$(find /mnt/openwrt/build_dir -path '*/linux-*/.kernelversion' -type f -print -quit 2>/dev/null | xargs -r cat || true)
          [ -n "$KERNEL_VER" ] || KERNEL_VER="未知"
          echo "KERNEL_VER=$KERNEL_VER" >> "$GITHUB_ENV"

      - name: Check space usage
        if: always()
        run: df -hT

      - name: Organize single firmware zip
        id: organize
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages

          PROFILE="${{ github.event.inputs.profile }}"
          MODEM="$MODEM_ID"

          mkdir -p flash_package

          BOOT_IMG=$(ls *boot.img.gz *boot.img 2>/dev/null | head -1 || true)
          SYSTEM_IMG=$(ls *system.img.gz *system.img 2>/dev/null | head -1 || true)

          if [ -z "$BOOT_IMG" ] || [ -z "$SYSTEM_IMG" ]; then
            echo "::error::没有找到 boot/system 镜像，当前目录文件："
            ls -la
            exit 1
          fi

          cp "$BOOT_IMG" flash_package/boot.img.gz
          cp "$SYSTEM_IMG" flash_package/system.img.gz
          gzip -dk flash_package/boot.img.gz
          gzip -dk flash_package/system.img.gz
          rm -f flash_package/boot.img.gz flash_package/system.img.gz

          if [ -d "$GITHUB_WORKSPACE/刷机脚本" ]; then
            cp -r "$GITHUB_WORKSPACE/刷机脚本/." flash_package/
          fi

          unix2dos flash_package/*.bat 2>/dev/null || true

          ZIP_NAME="OpenWrt_${PROFILE}_${MODEM}${{ env.FILE_DATE }}_刷机包.zip"
          cd flash_package
          zip -r "../$ZIP_NAME" .
          cd ..

          mkdir -p release_files
          mv "$ZIP_NAME" release_files/

          echo "FIRMWARE=$PWD/release_files" >> "$GITHUB_ENV"
          echo "FIRMWARE_ZIP=$PWD/release_files/$ZIP_NAME" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}_${{ env.MODEM_ID }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE_ZIP }}

      - name: Generate release body
        id: tag
        if: steps.organize.outputs.status == 'success' && !cancelled()
        run: |
          PROFILE="${{ github.event.inputs.profile }}"
          MODEM="$MODEM_ID"
          TAG="$(date +"%Y.%m.%d-%H%M")-${PROFILE}-${MODEM}"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

          {
            echo "## ImmortalWrt 高通410系列 · ${PROFILE} · ${MODEM_LABEL}"
            echo ""
            echo "| 项目 | 信息 |"
            echo "|------|------|"
            echo "| 编译者 | ${{ github.actor }} |"
            echo "| 机型 | ${PROFILE} |"
            echo "| Modem 选项 | ${MODEM_LABEL} |"
            echo "| 内部标识 | ${MODEM} |"
            echo "| 内核版本 | ${{ env.KERNEL_VER }} |"
            echo "| 默认用户 | root |"
            echo "| 默认密码 | 空 |"
            echo ""
            echo "### 说明"
            echo "- 保留modem：原始配置，不改 modem 相关包。"
            echo "- 仅去除用户态modem：去掉 ModemManager/QMI/MBIM/LuCI 协议。"
            echo "- 去除内核基带modem：不删包，只临时 patch DTS，尝试禁用 4080000.remoteproc/MPSS/reserved-memory。"
            echo "- Release 只额外上传一个刷机包；GitHub 固定显示 Source code(zip/tar.gz)，无法隐藏。"
            echo ""
            echo "### 额外添加的包"
            EXTRA=$(echo '${{ inputs.extra_packages }}' | sed 's/,/ /g' | tr ' ' '\n' | sed '/^$/d')
            if [ -n "$EXTRA" ]; then
              echo "$EXTRA" | sed 's/^/- /'
            else
              echo "无"
            fi
          } > release.txt

      - name: Upload single firmware zip to release
        uses: ncipollo/release-action@v1
        if: steps.organize.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ steps.tag.outputs.release_tag }}
          bodyFile: release.txt
          artifacts: ${{ env.FIRMWARE_ZIP }}
          artifactErrorsFailBuild: false
          allowUpdates: true
          draft: false
          prerelease: false
